# /etc/edex-greeter/greeter.toml — every key is optional.
theme = "tron"
# background = "/usr/share/edex-de/backgrounds/hexgrid-1080p.png"
default_session = "edex-de"
show_users = true
power_buttons = true
font_size = 15.0
# root (uid 0) is always listed; regular accounts start here.
min_uid = 1000
state_file = "/storage/etc/edex-greeter/state.toml"
