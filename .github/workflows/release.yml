name: Release

on:
  push:
    tags: ["v*"]
  # Release from the Actions tab: builds the checked-out branch, creates the tag on that commit and
  # publishes the release (the tag must match the version in Cargo.toml).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v4.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          grep -q "^version = \"${TAG#v}\"" Cargo.toml || { echo "::error::$TAG does not match the version in Cargo.toml"; exit 1; }
      - name: Source tarball
        # RustOS builds eDEX-DE from source in its ports tree (ports/edex-de/build.sh), against the
        # RustOS musl sysroot; the release publishes the pinned source and its checksum.
        run: |
          V=${TAG#v}
          mkdir -p dist
          git archive --format=tar.gz --prefix=edex-de-$V/ HEAD > dist/edex-de-$V.tar.gz
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Release notes
        run: |
          V=${TAG#v}
          awk -v v="$V" 'BEGIN{p=0} /^## /{p = ($2 == v)} p' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "eDEX-DE $V" > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
