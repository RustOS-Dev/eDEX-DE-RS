name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev pkg-config \
            librsvg2-bin dpkg-dev debhelper rpm fakeroot
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked --workspace --bins
          assets/make-assets.sh assets/generated
      - name: Tarball
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist/edex-de-$V
          cp target/release/edex-de target/release/edex-greeter packaging/session/edex-session dist/edex-de-$V/
          cp -r themes share packaging assets/generated dist/edex-de-$V/
          cp README.md LICENSE CHANGELOG.md dist/edex-de-$V/
          tar -C dist -czf dist/edex-de-$V-x86_64-linux.tar.gz edex-de-$V
      - name: Debian package
        run: |
          V=${GITHUB_REF_NAME#v}
          rm -rf build-deb && mkdir build-deb
          git archive --format=tar --prefix=edex-de-$V/ HEAD | tar -x -C build-deb
          cp -r packaging/debian build-deb/edex-de-$V/debian
          cd build-deb/edex-de-$V
          # Rust comes from rustup, not apt: skip the Build-Depends check; CI already ran the tests.
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b -d
          cp ../*.deb ../../dist/
      - name: RPM package
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          git archive --format=tar.gz --prefix=eDEX-DE-$V/ HEAD > ~/rpmbuild/SOURCES/v$V.tar.gz
          sed "s/^Version:.*/Version:        $V/" packaging/rpm/edex-de.spec > ~/rpmbuild/SPECS/edex-de.spec
          rpmbuild -bb --nodeps --nocheck ~/rpmbuild/SPECS/edex-de.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm dist/
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS
      - name: Release notes
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" 'BEGIN{p=0} /^## /{p = ($2 == v)} p' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "eDEX-DE $V" > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  aur:
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.ref_name, '-') }}
    # Job-level so the publish step's `if:` can see it (step-level env is not visible there).
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD with real checksum
        run: |
          V=${GITHUB_REF_NAME#v}
          curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$V.tar.gz" -o src.tar.gz
          SUM=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$V/" -e "s/^sha256sums=.*/sha256sums=('$SUM')/" packaging/aur/PKGBUILD > PKGBUILD
          cat PKGBUILD
      - name: Publish to AUR
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: edex-de
          pkgbuild: ./PKGBUILD
          commit_username: eDEX-OS
          commit_email: edex-de@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
