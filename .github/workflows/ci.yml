name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  # release.yml runs the full CI before publishing.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check · clippy · fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --all-targets
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev pkg-config dbus libnotify-bin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  smoke-sway:
    name: headless smoke test (sway + llvmpipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev pkg-config \
            sway foot grim wtype mesa-vulkan-drivers dbus libnotify-bin fonts-jetbrains-mono python3
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --bins
      - name: Shell smoke test
        run: scripts/smoke-sway.sh target/debug/edex-de target/smoke
      - name: Greeter smoke test
        run: scripts/smoke-greeter.sh target/debug/edex-greeter target/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: |
            target/smoke/*.png
            target/smoke/*.json
            target/smoke/*.log

  smoke-labwc:
    name: headless smoke test (labwc + llvmpipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev pkg-config \
            labwc foot grim mesa-vulkan-drivers dbus fonts-jetbrains-mono python3
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --bins
      - name: labwc smoke test (foreign-toplevel backend, generated rc.xml)
        run: scripts/smoke-labwc.sh target/debug/edex-de target/smoke-labwc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-labwc
          path: |
            target/smoke-labwc/*.png
            target/smoke-labwc/*.json
            target/smoke-labwc/*.log

  pkgbuild:
    name: makepkg (Arch container)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Prepare container
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo namcap
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build package from the checked-out tree
        run: |
          chown -R builder .
          sudo -u builder scripts/build-pkg.sh
      - name: namcap
        run: namcap packaging/aur/*.pkg.tar.zst || true
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/aur/*.pkg.tar.zst
