name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  # release.yml runs the full CI before publishing.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Host headers for the C libraries edex-comp and the shell link against. On RustOS the same
  # libraries come from the ports tree (see docs/rustos.md).
  SYSTEM_DEPS: >-
    libxkbcommon-dev libwayland-dev libvulkan-dev libdbus-1-dev libegl-dev libgbm-dev libdrm-dev
    libinput-dev libseat-dev libudev-dev libpixman-1-dev pkg-config

jobs:
  check:
    name: check · clippy · fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System dependencies
        run: sudo apt-get update -y && sudo apt-get install -y $SYSTEM_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --all-targets
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: sudo apt-get update -y && sudo apt-get install -y $SYSTEM_DEPS dbus libnotify-bin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
