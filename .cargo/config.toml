# RustOS runs x86_64-unknown-linux-musl binaries. They link dynamically against the RustOS ports
# (wayland, libxkbcommon, libinput, libseat, libudev-zero, Mesa), so the static-CRT default of the
# musl target is turned off. The RustOS kernel saves FPU state with FXSAVE only: build for the
# baseline x86-64 CPU (SSE2), never with AVX.
#
# The RustOS port recipe (RustOS: ports/edex-de/build.sh) supplies the linker and the pkg-config
# sysroot through CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER and PKG_CONFIG_SYSROOT_DIR.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static", "-C", "target-cpu=x86-64"]
