# eDEX-DE theme: Tron (default) — cyan on near-black, the classic eDEX-UI look.
name = "tron"
background = "#0a0e1a"
panel_bg = "#0d1117"
border = "#00d4ff"
text_primary = "#c8e6ff"
text_secondary = "#7ab5d0"
accent = "#00ff88"
warning = "#ff9f00"
error = "#ff4444"
cursor = "#00d4ff"
selection = "#00d4ff55"
glow = 0.8

[terminal]
fg = "#c8e6ff"
bg = "#0a0e1a"
palette = [
  "#0a0e1a", "#ff4444", "#00ff88", "#ffd866", "#3d8bff", "#c678dd", "#00d4ff", "#c8e6ff",
  "#4a6a8a", "#ff7a7a", "#66ffb3", "#ffe89a", "#7fb4ff", "#e0a4ff", "#7fe9ff", "#ffffff",
]

[keyboard]
key = "#0f1a2a"
key_active = "#00d4ffd8"
key_border = "#00d4ff99"
