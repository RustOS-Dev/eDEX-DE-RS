# eDEX-DE lock screen (hyprlock).
general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = fingerprint ready
    fingerprint:present_message = scanning…
}

background {
    monitor =
    path = /usr/share/edex-de/backgrounds/lock.png
    color = rgb(0a0e1a)
    blur_passes = 0
}

label {
    monitor =
    text = eDEX-DE // LOCKED
    color = rgb(00d4ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%H:%M:%S'
    color = rgb(c8e6ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B %Y'
    color = rgb(7ab5d0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(00d4ff)
    inner_color = rgb(0d1117)
    font_color = rgb(c8e6ff)
    check_color = rgb(00ff88)
    fail_color = rgb(ff4444)
    fade_on_empty = false
    placeholder_text = <span foreground="##7ab5d0">enter passphrase</span>
    fail_text = <span foreground="##ff4444">access denied ($ATTEMPTS)</span>
    rounding = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER @ $HOST
    color = rgb(7ab5d0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
